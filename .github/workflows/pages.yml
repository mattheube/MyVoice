name: Publish MyVoice website
on:
  push:
    branches: [main]
    paths: ['website/**', 'publishing/Prepare-Website.mjs', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      refresh_from_release:
        description: 'Test the release-to-main refresh path'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ (github.event_name == 'release' || inputs.refresh_from_release) && 'request' || 'deploy' }}
  cancel-in-progress: true
jobs:
  refresh:
    if: github.event_name == 'release' || inputs.refresh_from_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request deployment from the authorized main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
  deploy:
    if: github.event_name != 'release' && !inputs.refresh_from_release
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Resolve official Beta channel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node publishing/Prepare-Website.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: website
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
