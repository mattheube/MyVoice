name: Build and prepare release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - name: Compiler and critical tests
        shell: pwsh
        run: |
          dotnet build MyVoice.sln -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/MyVoice.Tests -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Database authorization tests
        shell: pwsh
        run: |
          npm ci --prefix backend/tests --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node backend/tests/community.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare distribution
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./publishing/Build-Release.ps1
      - name: Attest distribution
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            releases/MyVoiceSetup.exe
            releases/MyVoice-*-win-x64.zip
            releases/manifest.json
      - name: Create complete draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $channelArgs = @()
          if ($env:GITHUB_REF_NAME -match '-beta\.') { $channelArgs += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @channelArgs releases/MyVoiceSetup.exe releases/MyVoice-*-win-x64.zip releases/manifest.json releases/checksums.txt releases/soundpacks.json --draft --verify-tag --title "MyVoice $env:GITHUB_REF_NAME" --notes-file publishing/Release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
